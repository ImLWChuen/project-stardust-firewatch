version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: stardust_db
    environment:
      POSTGRES_USER: stardust
      POSTGRES_PASSWORD: stardust_password
      POSTGRES_DB: stardust_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stardust -d stardust_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stardust_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stardust_backend
    env_file: .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./science:/app/science
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stardust_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
